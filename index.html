
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Service</title>

  <!-- Libraries -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.6/dist/purify.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/highlight.js@11.11.1/lib/common.min.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/highlight.js@11.11.1/styles/github-dark.min.css">

  <style>
    :root {
      --bg: #101010;
      --sidebar: #151515;
      --panel: #181818;
      --panel2: #242424;
      --text: #f5f5f5;
      --muted: #999;
      --red: #e63946;
      --red-hover: #ff4b57;
      --border: #333;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      height: 100vh;
      overflow: hidden;
      background: var(--bg);
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
    }

    button, input, textarea, select {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    button:disabled {
      opacity: .5;
      cursor: not-allowed;
    }

    .app {
      display: flex;
      height: 100vh;
      width: 100%;
    }

    /* SIDEBAR */

    .sidebar {
      width: 270px;
      min-width: 270px;
      background: var(--sidebar);
      border-right: 1px solid var(--border);
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 13px;
    }

    .brand {
      font-size: 22px;
      font-weight: bold;
      padding: 10px 5px;
    }

    .brand span {
      color: var(--red);
    }

    .primary {
      background: var(--red);
      color: white;
      border: 0;
      border-radius: 9px;
      padding: 12px;
      font-weight: bold;
    }

    .primary:hover,
    .send:hover {
      background: var(--red-hover);
    }

    .secondary {
      background: var(--panel2);
      color: white;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 9px 12px;
    }

    select, input, textarea {
      background: var(--panel2);
      color: white;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 11px;
      outline: none;
      width: 100%;
    }

    select:focus, input:focus, textarea:focus {
      border-color: var(--red);
    }

    .section-label {
      color: var(--muted);
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-top: 7px;
    }

    .history {
      flex: 1;
      overflow-y: auto;
      min-height: 80px;
    }

    .history-item {
      display: flex;
      align-items: center;
      gap: 5px;
      padding: 9px;
      border-radius: 8px;
      margin-bottom: 4px;
    }

    .history-item:hover,
    .history-item.active {
      background: var(--panel2);
    }

    .history-title {
      flex: 1;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
      font-size: 13px;
      cursor: pointer;
    }

    .history-actions {
      position: relative;
    }

    .history-actions button {
      background: transparent;
      color: #aaa;
      border: 0;
      font-size: 19px;
      padding: 2px 5px;
    }

    .history-actions button:hover {
      color: white;
    }

    .history-menu {
      position: absolute;
      right: 0;
      top: 28px;
      z-index: 5;
      width: 125px;
      padding: 5px;
      background: #292929;
      border: 1px solid #444;
      border-radius: 8px;
      box-shadow: 0 8px 25px #0009;
    }

    .history-menu button {
      display: block;
      width: 100%;
      text-align: left;
      font-size: 12px;
      padding: 9px;
      border-radius: 5px;
    }

    .history-menu button:hover {
      background: #3a3a3a;
    }

    .history-menu .delete-option {
      color: #ff737d;
    }

    /* MAIN AREA */

    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
      height: 100%;
    }

    .topbar {
      min-height: 58px;
      padding: 12px 20px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .topbar strong {
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
    }

    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 25px max(20px, calc((100% - 850px)/2));
    }

    .welcome {
      text-align: center;
      margin: 100px auto 40px;
      max-width: 600px;
    }

    .welcome h1 {
      font-size: 34px;
    }

    .welcome p {
      color: var(--muted);
    }

    .message {
      display: flex;
      gap: 13px;
      margin: 24px 0;
      align-items: flex-start;
    }

    .avatar {
      min-width: 34px;
      height: 34px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: var(--panel2);
      font-size: 11px;
      font-weight: bold;
    }

    .message.user .avatar {
      background: var(--red);
    }

    .content {
      line-height: 1.65;
      min-width: 0;
      overflow-wrap: anywhere;
      flex: 1;
    }

    .content p:first-child {
      margin-top: 0;
    }

    .content pre {
      background: #090909;
      border: 1px solid var(--border);
      padding: 15px;
      border-radius: 10px;
      overflow-x: auto;
    }

    .content code {
      font-family: Consolas, monospace;
    }

    .content :not(pre) > code {
      background: #292929;
      padding: 2px 5px;
      border-radius: 4px;
    }

    .content img {
      max-width: 100%;
      border-radius: 10px;
    }

    .content table {
      border-collapse: collapse;
      width: 100%;
    }

    .content td,
    .content th {
      border: 1px solid var(--border);
      padding: 8px;
    }

    .code-toolbar {
      display: flex;
      justify-content: flex-end;
      gap: 7px;
      margin-bottom: -8px;
    }

    .code-toolbar button {
      background: #292929;
      color: white;
      border: 1px solid #444;
      border-radius: 5px;
      padding: 5px 9px;
      font-size: 11px;
    }

    /* COMPOSER */

    .composer-area {
      padding: 12px 20px 18px;
      border-top: 1px solid var(--border);
    }

    .composer {
      max-width: 850px;
      margin: auto;
      border: 1px solid #444;
      background: var(--panel);
      border-radius: 15px;
      padding: 10px;
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 8px;
    }

    .toolbar button {
      background: var(--panel2);
      color: white;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 7px 10px;
      font-size: 12px;
    }

    #prompt {
      border: 0;
      background: transparent;
      resize: none;
      min-height: 65px;
      max-height: 180px;
      font-size: 15px;
    }

    .composer-bottom {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .composer-bottom button {
      border: 0;
      border-radius: 8px;
      padding: 10px 15px;
    }

    .send {
      background: var(--red);
      color: white;
      font-weight: bold;
    }

    .upload {
      background: var(--panel2);
      color: white;
    }

    .status {
      color: var(--muted);
      font-size: 12px;
      text-align: center;
      padding: 5px;
    }

    #fileInput {
      display: none;
    }

    .attachments {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      margin: 8px 0;
    }

    .attachment {
      background: #292929;
      border: 1px solid #444;
      padding: 7px 10px;
      border-radius: 7px;
      font-size: 12px;
    }

    .attachment button {
      background: none;
      color: white;
      border: 0;
      margin-left: 5px;
      padding: 0;
    }

    /* ENCYCLOPEDIA AI */

    .encyclopedia-panel {
      display: none;
      flex: 1;
      min-height: 0;
      overflow: auto;
      padding: 16px;
      background: var(--bg);
    }

    .encyclopedia-panel.active {
      display: block;
    }

    .encyclopedia-widget {
      width: 100%;
      min-height: 70vh;
      height: 100%;
      max-width: 1100px;
      margin: 0 auto;
      border: 1px solid var(--border);
      border-radius: 14px;
      overflow: hidden;
      background: var(--panel);
      padding: 10px;
    }

    .encyclopedia-widget > div {
      min-height: 65vh;
    }

    /* MODALS */

    .modal {
      position: fixed;
      inset: 0;
      background: #000b;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 10;
    }

    .modal.open {
      display: flex;
    }

    .modal-box {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
      width: min(800px, 100%);
      max-height: 90vh;
      overflow: auto;
    }

    .modal-box textarea {
      min-height: 300px;
      margin: 12px 0;
      resize: vertical;
    }

    .preview-frame {
      width: 100%;
      height: 400px;
      background: white;
      border: 0;
      border-radius: 8px;
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-top: 15px;
    }

    .modal-actions button {
      padding: 9px 14px;
      border-radius: 7px;
      border: 0;
    }

    .cancel-button {
      background: #333;
      color: white;
    }

    .confirm-button {
      background: var(--red);
      color: white;
    }

    @media(max-width:700px) {
      .sidebar {
        width: 190px;
        min-width: 190px;
        padding: 9px;
      }

      .messages {
        padding: 15px;
      }

      .composer-area {
        padding: 8px;
      }
    }

    @media(max-width:500px) {
      .sidebar {
        width: 145px;
        min-width: 145px;
      }

      .brand {
        font-size: 16px;
      }

      .topbar {
        padding: 10px;
      }

      .topbar .secondary {
        padding: 7px;
        font-size: 11px;
      }
    }
  </style>
</head>

<body>
<div class="app">

  <!-- SIDEBAR -->
  <aside class="sidebar">

    <div class="brand">AI <span>Service</span></div>

    <button class="primary" onclick="newChat()">
      + New Chat
    </button>

    <div class="section-label">Provider</div>

    <select id="provider" onchange="providerChanged()">
      <option value="Gemini">Gemini</option>
      <option value="Encyclopedia AI">Encyclopedia AI</option>
    </select>

    <div class="section-label" id="modelLabel">
      Model
    </div>

    <select id="model">
      <option value="">Loading models...</option>
    </select>

    <div class="section-label">Your chats</div>

    <div class="history" id="history"></div>

    <button class="secondary" onclick="openWriter()">
      Writing Editor
    </button>

    <div class="status" id="modelStatus">
      Loading Gemini profiles...
    </div>

  </aside>

  <!-- MAIN CONTENT -->
  <main class="main">

    <header class="topbar">
      <strong id="chatTitle">New Chat</strong>
      <button class="secondary" onclick="newChat()">
        New Chat
      </button>
    </header>

    <!-- GEMINI CHAT -->
    <section class="messages" id="messages">
      <div class="welcome">
        <h1>What can I help with?</h1>
        <p>Ask anything. Let's get started.</p>
      </div>
    </section>

    <!-- ENCYCLOPEDIA AI -->
    <section
      class="encyclopedia-panel"
      id="encyclopediaPanel"
      aria-label="Encyclopedia AI"
    >
      <div class="encyclopedia-widget">
        <div
          class="elfsight-app-7568ba73-5055-478b-b276-749a252f0d1e"
          data-elfsight-app-lazy>
        </div>
      </div>
    </section>

    <!-- MESSAGE COMPOSER -->
    <section class="composer-area" id="composerArea">

      <div class="composer">

        <div class="toolbar">
          <button onclick="formatText('**','**')">
            <b>B</b>
          </button>

          <button onclick="formatText('*','*')">
            <i>I</i>
          </button>

          <button onclick="formatText('<u>','</u>')">
            <u>U</u>
          </button>

          <button onclick="formatText('## ','')">
            Heading
          </button>

          <button onclick="formatText('- ','')">
            • List
          </button>

          <button onclick="formatText('1. ','')">
            1. List
          </button>

          <button onclick="formatText('> ','')">
            Quote
          </button>

          <button onclick="formatText('\n```\n','\n```\n')">
            Code
          </button>
        </div>

        <textarea
          id="prompt"
          placeholder="Message AI Service..."
          onkeydown="handleEnter(event)"
        ></textarea>

        <div class="attachments" id="attachments"></div>

        <div class="composer-bottom">

          <div>
            <button
              class="upload"
              onclick="document.getElementById('fileInput').click()"
            >
              + Upload
            </button>

            <input
              id="fileInput"
              type="file"
              multiple
              onchange="handleFiles(event)"
            >
          </div>

          <button
            class="send"
            id="sendButton"
            onclick="sendMessage()"
          >
            Send ↑
          </button>

        </div>
      </div>

      <div class="status">
        AI responses may contain mistakes. Check important information.
      </div>

    </section>

  </main>
</div>

<!-- WRITING EDITOR -->
<div class="modal" id="writerModal">
  <div class="modal-box">

    <h2>Writing Editor</h2>

    <textarea
      id="writerText"
      placeholder="Write something here..."
    ></textarea>

    <button class="secondary" onclick="insertWriting()">
      Insert into chat
    </button>

    <button class="primary" onclick="closeWriter()">
      Close
    </button>

  </div>
</div>

<!-- CODE PREVIEW -->
<div class="modal" id="previewModal">
  <div class="modal-box">

    <h2>Code Preview</h2>

    <iframe
      id="previewFrame"
      class="preview-frame"
      sandbox
      title="Code preview"
    ></iframe>

    <button class="primary" onclick="closePreview()">
      Close Preview
    </button>

  </div>
</div>

<!-- RENAME CHAT -->
<div class="modal" id="renameModal">
  <div class="modal-box">

    <h2>Rename chat</h2>

    <p>Choose a new name for this conversation.</p>

    <input
      id="renameInput"
      type="text"
      maxlength="70"
      placeholder="Chat name"
    >

    <div class="modal-actions">
      <button class="cancel-button" onclick="closeRename()">
        Cancel
      </button>

      <button class="confirm-button" onclick="confirmRename()">
        Save
      </button>
    </div>

  </div>
</div>

<!-- ELFSIGHT SCRIPT -->
<script src="https://elfsightcdn.com/platform.js" async></script>

<script>
/* =========================================================
   AI SERVICE
   Gemini profiles are loaded from /api/models.
   Gemini messages are sent to /api/chat.
   Encyclopedia AI is provided separately by Elfsight.
========================================================= */

marked.setOptions({
  breaks: true,
  gfm: true
});

/* STATE */

let groups = {};
let chats = [];
let currentChatId = null;
let selectedFiles = [];
let busy = false;
let renamingChatId = null;

const $ = id => document.getElementById(id);

function makeId() {
  return Date.now().toString(36) +
    Math.random().toString(36).slice(2, 8);
}

function currentChat() {
  return chats.find(chat => chat.id === currentChatId);
}

function saveChats() {
  try {
    localStorage.setItem(
      "ai_service_chats",
      JSON.stringify(chats)
    );
  } catch (error) {
    console.error("Could not save chats:", error);
  }
}

/* LOAD CHAT HISTORY */

function loadChats() {
  try {
    const saved = JSON.parse(
      localStorage.getItem("ai_service_chats") || "[]"
    );

    chats = Array.isArray(saved) ? saved : [];

  } catch {
    chats = [];
  }

  chats.forEach(chat => {
    if (!Array.isArray(chat.messages)) {
      chat.messages = [];
    }

    chat.provider = "Gemini";
  });

  const savedProvider =
    localStorage.getItem("ai_service_provider");

  $("provider").value =
    savedProvider === "Encyclopedia AI"
      ? "Encyclopedia AI"
      : "Gemini";

  if (chats.length > 0) {
    currentChatId = chats[0].id;
    renderChat();
  } else {
    createChat(false);
  }

  renderHistory();
  updateProviderView();
}

/* CREATE NEW CHAT */

function createChat(shouldFocus = true) {
  const chat = {
    id: makeId(),
    title: "New Chat",
    messages: [],
    provider: "Gemini",
    model: $("model").value || ""
  };

  chats.unshift(chat);
  currentChatId = chat.id;

  saveChats();
  renderHistory();
  renderChat();

  if (groups.Gemini?.length) {
    updateModels(chat.model);
  }

  $("provider").value = "Gemini";
  localStorage.setItem("ai_service_provider", "Gemini");

  updateProviderView();

  if (shouldFocus) {
    $("prompt").focus();
  }
}

function newChat() {
  if (busy) return;
  createChat(true);
}

/* CHAT HISTORY DISPLAY */

function renderHistory() {
  const history = $("history");
  history.innerHTML = "";

  chats.forEach(chat => {
    const item = document.createElement("div");

    item.className =
      "history-item" +
      (chat.id === currentChatId ? " active" : "");

    const title = document.createElement("span");
    title.className = "history-title";
    title.textContent = chat.title || "New Chat";

    title.onclick = () => {
      if (busy) return;

      currentChatId = chat.id;

      $("provider").value = "Gemini";
      localStorage.setItem("ai_service_provider", "Gemini");

      renderChat();
      renderHistory();

      if (groups.Gemini?.length) {
        updateModels(chat.model || "");
      }

      updateProviderView();
    };

    const actions = document.createElement("div");
    actions.className = "history-actions";

    const menuButton = document.createElement("button");
    menuButton.type = "button";
    menuButton.textContent = "⋯";
    menuButton.title = "Chat options";

    menuButton.onclick = event => {
      event.stopPropagation();

      const existing = actions.querySelector(".history-menu");

      document.querySelectorAll(".history-menu").forEach(menu => {
        menu.remove();
      });

      if (existing) return;

      const menu = document.createElement("div");
      menu.className = "history-menu";

      const renameButton = document.createElement("button");
      renameButton.textContent = "Rename";

      renameButton.onclick = () => {
        menu.remove();
        openRename(chat.id);
      };

      const deleteButton = document.createElement("button");
      deleteButton.textContent = "Delete";
      deleteButton.className = "delete-option";

      deleteButton.onclick = () => {
        menu.remove();
        deleteChat(chat.id);
      };

      menu.append(renameButton, deleteButton);
      actions.appendChild(menu);
    };

    actions.appendChild(menuButton);
    item.append(title, actions);
    history.appendChild(item);
  });
}

/* RENAME CHAT */

function openRename(id) {
  const chat = chats.find(item => item.id === id);
  if (!chat) return;

  renamingChatId = id;
  $("renameInput").value = chat.title || "";
  $("renameModal").classList.add("open");

  setTimeout(() => $("renameInput").focus(), 50);
}

function closeRename() {
  $("renameModal").classList.remove("open");
  renamingChatId = null;
}

function confirmRename() {
  if (!renamingChatId) return;

  const name = $("renameInput").value.trim();
  if (!name) return;

  const chat = chats.find(item => item.id === renamingChatId);
  if (!chat) return;

  chat.title = name;

  saveChats();
  renderHistory();

  if (chat.id === currentChatId) {
    $("chatTitle").textContent = name;
  }

  closeRename();
}

$("renameInput").addEventListener("keydown", event => {
  if (event.key === "Enter") {
    confirmRename();
  }

  if (event.key === "Escape") {
    closeRename();
  }
});

/* DELETE CHAT */

function deleteChat(id) {
  const chat = chats.find(item => item.id === id);
  if (!chat) return;

  if (!confirm("Delete this chat?")) return;

  chats = chats.filter(item => item.id !== id);

  if (currentChatId === id) {
    currentChatId = chats[0]?.id || null;

    if (!currentChatId) {
      saveChats();
      createChat(false);
      return;
    }

    renderChat();

    if (groups.Gemini?.length) {
      updateModels(currentChat()?.model || "");
    }
  }

  saveChats();
  renderHistory();
  updateProviderView();
}

/* MARKDOWN DISPLAY */

function renderMarkdown(text) {
  return DOMPurify.sanitize(
    marked.parse(String(text || ""))
  );
}

function renderChat() {
  const chat = currentChat();
  if (!chat) return;

  $("chatTitle").textContent = chat.title || "New Chat";
  $("messages").innerHTML = "";

  if (!chat.messages.length) {
    $("messages").innerHTML = `
      <div class="welcome">
        <h1>What can I help with?</h1>
        <p>Ask anything. Let's get started.</p>
      </div>
    `;
    return;
  }

  chat.messages.forEach(message => {
    let display = message.content;

    if (Array.isArray(display)) {
      display = display.map(part => {
        if (part.type === "text") {
          return part.text;
        }

        if (part.type === "image_url") {
          return "[Image attached]";
        }

        return "";
      }).join("\n");
    }

    addMessage(message.role, display);
  });
}

function addMessage(role, content) {
  const message = document.createElement("div");
  message.className = "message " + role;

  const avatar = document.createElement("div");
  avatar.className = "avatar";
  avatar.textContent = role === "user" ? "YOU" : "AI";

  const body = document.createElement("div");
  body.className = "content";
  body.innerHTML = renderMarkdown(content);

  /* CODE BLOCK BUTTONS */

  body.querySelectorAll("pre").forEach(pre => {
    const code = pre.querySelector("code");

    const toolbar = document.createElement("div");
    toolbar.className = "code-toolbar";

    const copy = document.createElement("button");
    copy.textContent = "Copy code";

    copy.onclick = async () => {
      try {
        await navigator.clipboard.writeText(
          code?.innerText || pre.innerText
        );

        copy.textContent = "Copied!";

        setTimeout(() => {
          copy.textContent = "Copy code";
        }, 1200);

      } catch {
        copy.textContent = "Copy failed";
      }
    };

    const preview = document.createElement("button");
    preview.textContent = "Preview";

    preview.onclick = () => {
      previewCode(code?.innerText || pre.innerText);
    };

    toolbar.append(copy, preview);
    pre.before(toolbar);
  });

  body.querySelectorAll("pre code").forEach(block => {
    hljs.highlightElement(block);
  });

  message.append(avatar, body);
  $("messages").appendChild(message);

  $("messages").scrollTop =
    $("messages").scrollHeight;
}

/* CODE PREVIEW */

function previewCode(code) {
  if (!/<\s*(html|!doctype|body|div|script|style|h[1-6])\b/i.test(code)) {
    alert("Live preview currently supports HTML code.");
    return;
  }

  $("previewFrame").srcdoc = code;
  $("previewModal").classList.add("open");
}

function closePreview() {
  $("previewModal").classList.remove("open");
  $("previewFrame").srcdoc = "";
}

/* TEXT FORMATTING */

function formatText(before, after) {
  const input = $("prompt");

  const start = input.selectionStart;
  const end = input.selectionEnd;

  const selected = input.value.slice(start, end);

  input.value =
    input.value.slice(0, start) +
    before +
    selected +
    after +
    input.value.slice(end);

  input.focus();

  input.selectionStart = start + before.length;
  input.selectionEnd =
    start + before.length + selected.length;
}

function handleEnter(event) {
  if (
    event.key === "Enter" &&
    !event.shiftKey
  ) {
    event.preventDefault();
    sendMessage();
  }
}

/* LOAD GEMINI MODELS */

async function loadModels() {
  const modelSelect = $("model");
  const status = $("modelStatus");

  status.textContent = "Loading Gemini profiles...";
  modelSelect.innerHTML =
    '<option value="">Loading models...</option>';

  try {
    const response = await fetch(
      "/api/models?refresh=" + Date.now(),
      {
        method: "GET",
        cache: "no-store",
        headers: {
          "Accept": "application/json"
        }
      }
    );

    const responseText = await response.text();

    let data;

    try {
      data = JSON.parse(responseText);
    } catch {
      throw new Error(
        "The models API did not return valid JSON."
      );
    }

    if (!response.ok) {
      throw new Error(
        data.error || "Models API error: HTTP " + response.status
      );
    }

    if (data.success !== true) {
      throw new Error(
        data.error || "The models API reported a failure."
      );
    }

    const models = data.groups?.Gemini;

    if (!Array.isArray(models) || models.length === 0) {
      throw new Error(
        "The API returned no Gemini profiles."
      );
    }

    groups = {
      ...data.groups,
      Gemini: models
    };

    const savedModel = currentChat()?.model || "";

    updateModels(savedModel);

    status.textContent =
      models.length + " Gemini profiles loaded";

  } catch (error) {
    console.error("Gemini model loading error:", error);

    modelSelect.innerHTML =
      '<option value="">Could not load models</option>';

    status.textContent =
      "Model loading failed: " + error.message;
  }
}

/* UPDATE MODEL DROPDOWN */

function updateModels(preferredModel = "") {
  const modelSelect = $("model");
  const models = Array.isArray(groups.Gemini)
    ? groups.Gemini
    : [];

  modelSelect.innerHTML = "";

  if (models.length === 0) {
    modelSelect.add(
      new Option("No Gemini models available", "")
    );
    return;
  }

  models.forEach(model => {
    modelSelect.add(
      new Option(model.name, model.id)
    );
  });

  const validPreferredModel = models.some(
    model => model.id === preferredModel
  );

  const selectedModel = validPreferredModel
    ? preferredModel
    : models[0].id;

  modelSelect.value = selectedModel;

  const chat = currentChat();

  if (chat) {
    chat.provider = "Gemini";
    chat.model = selectedModel;
    saveChats();
  }
}

/* PROVIDER SWITCHING */

function providerChanged() {
  const provider = $("provider").value;

  localStorage.setItem(
    "ai_service_provider",
    provider
  );

  if (provider === "Gemini") {
    const chat = currentChat();

    if (groups.Gemini?.length) {
      updateModels(chat?.model || "");
    }
  }

  updateProviderView();
}

function updateProviderView() {
  const isEncyclopedia =
    $("provider").value === "Encyclopedia AI";

  $("modelLabel").style.display =
    isEncyclopedia ? "none" : "block";

  $("model").style.display =
    isEncyclopedia ? "none" : "block";

  $("modelStatus").style.display =
    isEncyclopedia ? "none" : "block";

  $("messages").style.display =
    isEncyclopedia ? "none" : "block";

  $("composerArea").style.display =
    isEncyclopedia ? "none" : "block";

  $("encyclopediaPanel").classList.toggle(

    isEncyclopedia
  );

  $("chatTitle").textContent = isEncyclopedia

    : (currentChat()?.title || "New Chat");
}

/* MODEL SELECTION */

$("model").addEventListener("change", () => {
  const chat = currentChat();

  if (!chat) return;

  chat.provider = "Gemini";
  chat.model = $("model").value;

  saveChats();
});

/* FILE UPLOADS */

async function fileToDataURL(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();

    reader.onload = () => resolve(reader.result);

    reader.onerror = () => {
      reject(new Error("Could not read " + file.name));
    };

    reader.readAsDataURL(file);
  });
}

function handleFiles(event) {
  const incoming = Array.from(
    event.target.files || []
  );

  selectedFiles.push(...incoming);

  renderAttachments();

  event.target.value = "";
}

function renderAttachments() {
  $("attachments").innerHTML = "";

  selectedFiles.forEach((file, index) => {
    const item = document.createElement("div");
    item.className = "attachment";

    const name = document.createElement("span");

    name.textContent =
      file.name + " (" +
      (file.size / 1024).toFixed(1) +
      " KB)";

    const remove = document.createElement("button");
    remove.textContent = "×";
    remove.title = "Remove attachment";

    remove.onclick = () => {
      selectedFiles.splice(index, 1);
      renderAttachments();
    };

    item.append(name, remove);
    $("attachments").appendChild(item);
  });
}

/* DOCUMENT EXTRACTION */

async function extractDocument(file) {
  const dataURL = await fileToDataURL(file);
  const base64 = dataURL.split(",")[1];

  if (!base64) {
    throw new Error("Could not encode " + file.name);
  }

  if (base64.length > 3500000) {
    throw new Error(
      file.name +
      " is too large for the current document reader. Try a smaller file."
    );
  }

  const response = await fetch("/api/extract", {
    method: "POST",
    headers: {
      "Content-Type": "application/json"
    },
    body: JSON.stringify({
      files: [{
        name: file.name,
        data: base64
      }]
    })
  });

  const data = await response.json();

  if (!response.ok || !data.success) {
    throw new Error(
      data.error || "Could not extract " + file.name
    );
  }

  const result = data.files?.[0];

  if (!result?.success) {
    throw new Error(
      result?.error || "Could not read " + file.name
    );
  }

  return result.text || "";
}

/* SEND MESSAGE */

async function sendMessage() {
  if (busy) return;

  const text = $("prompt").value.trim();

  if (!text && selectedFiles.length === 0) {
    return;
  }

  const provider = $("provider").value;

  if (provider === "Encyclopedia AI") {
    updateProviderView();
    return;
  }

  const model = $("model").value;

  if (!model) {
    alert("Please select a Gemini model first.");
    return;
  }

  const chat = currentChat();

  if (!chat) return;

  busy = true;

  $("sendButton").disabled = true;
  $("sendButton").textContent = "Preparing...";

  try {
    const parts = [];

    if (text) {
      parts.push({
        type: "text",
        text
      });
    }

    for (const file of selectedFiles) {
      const type =
        file.type || "application/octet-stream";

      const extension =
        file.name.split(".").pop().toLowerCase();

      /* IMAGES */

      if (type.startsWith("image/")) {
        const allowed = [
          "image/png",
          "image/jpeg",
          "image/webp",
          "image/gif"
        ];

        if (!allowed.includes(type)) {
          parts.push({
            type: "text",
            text:
              "Image " + file.name +
              " has an unsupported image format."
          });

          continue;
        }

        const dataURL = await fileToDataURL(file);

        parts.push({
          type: "text",
          text: "Attached image: " + file.name
        });

        parts.push({
          type: "image_url",
          image_url: {
            url: dataURL
          }
        });
      }

      /* TEXT FILES */

      else if (
        type.startsWith("text/") ||
        /\.(txt|md|csv|json|js|jsx|ts|tsx|html|css|xml|yaml|yml|py|java|c|cpp|sql|log|sh)$/i.test(file.name)
      ) {
        const contents = await file.text();

        parts.push({
          type: "text",
          text:
            "\n\nATTACHED FILE: " + file.name +
            "\nCONTENTS:\n" + contents
        });
      }

      /* DOCUMENT FILES */

      else if (
        ["pdf", "docx", "xlsx", "xls", "pptx"].includes(extension)
      ) {
        $("sendButton").textContent = "Reading files...";

        try {
          const contents = await extractDocument(file);

          if (!contents.trim()) {
            throw new Error(
              "No readable text was found in this file."
            );
          }

          parts.push({
            type: "text",
            text:
              "\n\nATTACHED FILE: " + file.name +
              "\nEXTRACTED CONTENTS:\n" + contents
          });

        } catch (error) {
          parts.push({
            type: "text",
            text:
              "\n\nCould not read attached file " +
              file.name + ". Reason: " + error.message
          });
        }
      }

      /* OTHER FILE TYPES */

      else {
        parts.push({
          type: "text",
          text:
            "\n\nThe user attached " + file.name +
            " (" + type +
            "). This format is not supported for text extraction yet."
        });
      }
    }

    const displayText =
      text ||
      "Attached " + selectedFiles.length + " file(s).";

    if (chat.messages.length === 0) {
      chat.title = displayText.slice(0, 35);
    }

    chat.provider = "Gemini";
    chat.model = model;

    const userMessage = {
      role: "user",
      content:
        parts.length === 1 && parts[0].type === "text"
          ? parts[0].text
          : parts
    };

    chat.messages.push(userMessage);

    addMessage("user", displayText);

    $("prompt").value = "";
    selectedFiles = [];
    renderAttachments();

    saveChats();
    renderHistory();

    /* LOADING MESSAGE */

    const loading = document.createElement("div");
    loading.className = "message";

    loading.innerHTML =
      '<div class="avatar">AI</div>' +
      '<div class="content">Thinking...</div>';

    $("messages").appendChild(loading);

    $("sendButton").textContent = "Thinking...";

    /* GEMINI API REQUEST */

    const response = await fetch("/api/chat", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        provider: "Gemini",
        model,
        messages: chat.messages
      })
    });

    let data;

    try {
      data = await response.json();
    } catch {
      throw new Error(
        "The chat API returned an invalid response."
      );
    }

    loading.remove();

    if (!response.ok || data.success === false) {
      throw new Error(
        data.error || "The request failed."
      );
    }

    if (typeof data.reply !== "string") {
      throw new Error(
        "The chat API did not return a reply."
      );
    }

    chat.messages.push({
      role: "assistant",
      content: data.reply
    });

    addMessage("assistant", data.reply);

    saveChats();
    renderHistory();

  } catch (error) {
    console.error("Message error:", error);

    addMessage(
      "assistant",
      "**Error:** " + error.message
    );

  } finally {
    busy = false;

    $("sendButton").disabled = false;
    $("sendButton").textContent = "Send ↑";
  }
}

/* WRITING EDITOR */

function openWriter() {
  $("writerModal").classList.add("open");
}

function closeWriter() {
  $("writerModal").classList.remove("open");
}

function insertWriting() {
  const writing = $("writerText").value;

  $("prompt").value +=
    ($("prompt").value ? "\n\n" : "") +
    writing;

  closeWriter();
  $("prompt").focus();
}

$("previewModal").addEventListener("click", event => {

    closePreview();

});

    closeRename();

});

loadChats();
loadModels();
