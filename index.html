
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Service</title>

<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.6/dist/purify.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/highlight.js@11.11.1/lib/common.min.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/highlight.js@11.11.1/styles/github-dark.min.css">

<style>
:root {
  --bg: #101010;
  --panel: #181818;
  --panel2: #222;
  --text: #f5f5f5;
  --muted: #999;
  --red: #e63946;
  --border: #303030;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: Arial, sans-serif;
  height: 100vh;
  overflow: hidden;
}

button, input, textarea, select {
  font: inherit;
}

button {
  cursor: pointer;
}

.app {
  display: flex;
  height: 100vh;
}

.sidebar {
  width: 270px;
  background: #151515;
  border-right: 1px solid var(--border);
  padding: 16px;
  display: flex;
  flex-direction: column;
  gap: 13px;
}

.brand {
  font-size: 21px;
  font-weight: bold;
  padding: 10px 5px;
}

.brand span { color: var(--red); }

.primary {
  background: var(--red);
  color: white;
  border: 0;
  border-radius: 9px;
  padding: 12px;
  font-weight: bold;
}

.secondary {
  background: var(--panel2);
  color: white;
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 9px 12px;
}

select, input, textarea {
  background: var(--panel2);
  color: white;
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 11px;
  outline: none;
  width: 100%;
}

select:focus, input:focus, textarea:focus {
  border-color: var(--red);
}

.section-label {
  color: var(--muted);
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 1px;
  margin-top: 7px;
}

.history {
  flex: 1;
  overflow-y: auto;
}

.history-item {
  display: flex;
  align-items: center;
  gap: 5px;
  padding: 9px;
  border-radius: 8px;
  cursor: pointer;
  margin-bottom: 4px;
}

.history-item:hover, .history-item.active {
  background: var(--panel2);
}

.history-title {
  flex: 1;
  overflow: hidden;
  white-space: nowrap;
  text-overflow: ellipsis;
  font-size: 13px;
}

.history-actions button {
  background: transparent;
  color: #aaa;
  border: 0;
  padding: 3px;
}

.main {
  flex: 1;
  display: flex;
  flex-direction: column;
  min-width: 0;
}

.topbar {
  height: 58px;
  padding: 12px 20px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.topbar strong { font-size: 16px; }

.messages {
  flex: 1;
  overflow-y: auto;
  padding: 25px max(20px, calc((100% - 850px)/2));
}

.welcome {
  text-align: center;
  margin: 100px auto 40px;
  max-width: 600px;
}

.welcome h1 { font-size: 34px; }
.welcome p { color: var(--muted); }

.message {
  display: flex;
  gap: 13px;
  margin: 22px 0;
  align-items: flex-start;
}

.avatar {
  min-width: 34px;
  height: 34px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  background: var(--panel2);
  font-size: 13px;
  font-weight: bold;
}

.message.user .avatar {
  background: var(--red);
}

.content {
  line-height: 1.65;
  min-width: 0;
  overflow-wrap: anywhere;
  flex: 1;
}

.content p:first-child { margin-top: 0; }
.content pre {
  background: #090909;
  border: 1px solid var(--border);
  padding: 15px;
  border-radius: 10px;
  overflow-x: auto;
}

.content code {
  font-family: Consolas, monospace;
}

.content :not(pre) > code {
  background: #292929;
  padding: 2px 5px;
  border-radius: 4px;
}

.content img {
  max-width: 100%;
  border-radius: 10px;
}

.content table {
  border-collapse: collapse;
  width: 100%;
}

.content td, .content th {
  border: 1px solid var(--border);
  padding: 8px;
}

.code-toolbar {
  display: flex;
  justify-content: flex-end;
  gap: 7px;
  margin-bottom: -8px;
}

.code-toolbar button {
  background: #292929;
  color: white;
  border: 1px solid #444;
  border-radius: 5px;
  padding: 5px 9px;
  font-size: 11px;
}

.composer-area {
  padding: 12px 20px 18px;
  border-top: 1px solid var(--border);
}

.composer {
  max-width: 850px;
  margin: auto;
  border: 1px solid #444;
  background: var(--panel);
  border-radius: 15px;
  padding: 10px;
}

.toolbar {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-bottom: 8px;
}

.toolbar button {
  background: var(--panel2);
  color: white;
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 7px 10px;
  font-size: 12px;
}

#prompt {
  border: 0;
  background: transparent;
  resize: none;
  min-height: 65px;
  max-height: 180px;
  font-size: 15px;
}

.composer-bottom {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
}

.composer-bottom button {
  border: 0;
  border-radius: 8px;
  padding: 10px 15px;
}

.send {
  background: var(--red);
  color: white;
  font-weight: bold;
}

.upload {
  background: var(--panel2);
  color: white;
}

.status {
  color: var(--muted);
  font-size: 12px;
  text-align: center;
  padding: 5px;
}

#fileInput { display: none; }

.modal {
  position: fixed;
  inset: 0;
  background: #000b;
  display: none;
  align-items: center;
  justify-content: center;
  padding: 20px;
  z-index: 10;
}

.modal.open { display: flex; }

.modal-box {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 20px;
  width: min(700px, 100%);
}

.modal-box textarea {
  min-height: 260px;
  margin: 12px 0;
  resize: vertical;
}

@media(max-width:700px) {
  .sidebar { width: 190px; padding: 9px; }
  .messages { padding: 15px; }
  .composer-area { padding: 8px; }
}

@media(max-width:500px) {
  .sidebar { width: 145px; }
  .brand { font-size: 16px; }
}
</style>
</head>

<body>
<div class="app">

<aside class="sidebar">
  <div class="brand">AI <span>Service</span></div>

  <button class="primary" onclick="newChat()">+ New Chat</button>

  <div class="section-label">Provider</div>
  <select id="provider" onchange="providerChanged()">
    <option value="Gemini">Google Gemini</option>
    <option value="Groq">ChatGPT</option>
    <option value="OpenAI (OpenRouter)">OpenAI</option>
    <option value="Gemini (OpenRouter)">Gemini via OpenRouter</option>
    <option value="DeepSeek">DeepSeek</option>
    <option value="Claude">Claude</option>
    <option value="Qwen">Qwen</option>
    <option value="Llama">Llama</option>
    <option value="Other">Other models</option>
  </select>

  <div class="section-label">Model</div>
  <select id="model">
    <option value="">Loading models...</option>
  </select>

  <div class="section-label">Your chats</div>
  <div class="history" id="history"></div>

  <button class="secondary" onclick="openWriter()">Writing Editor</button>
  <div class="status" id="modelStatus">Loading models...</div>
</aside>

<main class="main">
  <header class="topbar">
    <strong id="chatTitle">New Chat</strong>
    <button class="secondary" onclick="newChat()">New Chat</button>
  </header>

  <section class="messages" id="messages">
    <div class="welcome" id="welcome">
      <h1>What can I help with?</h1>
      <p>Ask anything. Let's get started.</p>
    </div>
  </section>

  <section class="composer-area">
    <div class="composer">
      <div class="toolbar">
        <button onclick="formatText('**','**')"><b>B</b></button>
        <button onclick="formatText('*','*')"><i>I</i></button>
        <button onclick="formatText('<u>','</u>')"><u>U</u></button>
        <button onclick="formatText('## ','')">H</button>
        <button onclick="formatText('- ','')">• List</button>
        <button onclick="formatText('1. ','')">1. List</button>
        <button onclick="formatText('> ','')">Quote</button>
        <button onclick="formatText('\n```\n','\n```\n')">Code</button>
      </div>

      <textarea id="prompt" placeholder="Message AI Service..." onkeydown="handleEnter(event)"></textarea>

      <div class="composer-bottom">
        <div>
          <button class="upload" onclick="document.getElementById('fileInput').click()">+ Upload</button>
          <input id="fileInput" type="file" multiple accept=".txt,.md,.csv,.json,.pdf,.png,.jpg,.jpeg" onchange="handleFiles(event)">
          <span id="fileLabel" class="status"></span>
        </div>
        <button class="send" id="sendButton" onclick="sendMessage()">Send ↑</button>
      </div>
    </div>
    <div class="status">AI responses may contain mistakes. Check important information.</div>
  </section>
</main>
</div>

<div class="modal" id="writerModal">
  <div class="modal-box">
    <h2>Writing Editor</h2>
    <textarea id="writerText" placeholder="Write something here..."></textarea>
    <button class="secondary" onclick="insertWriting()">Insert into chat</button>
    <button class="primary" onclick="closeWriter()">Close</button>
  </div>
</div>

<script>
marked.setOptions({
  breaks: true,
  gfm: true
});

let groups = {};
let chats = [];
let currentChatId = null;
let selectedFiles = [];
let busy = false;

const $ = id => document.getElementById(id);

function makeId() {
  return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
}

function currentChat() {
  return chats.find(chat => chat.id === currentChatId);
}

function saveChats() {
  localStorage.setItem("ai_service_chats", JSON.stringify(chats));
}

function loadChats() {
  try {
    chats = JSON.parse(localStorage.getItem("ai_service_chats") || "[]");
  } catch {
    chats = [];
  }

  if (chats.length) {
    currentChatId = chats[0].id;
    renderChat();
  } else {
    newChat();
  }

  renderHistory();
}

function newChat() {
  const chat = {
    id: makeId(),
    title: "New Chat",
    messages: [],
    provider: $("provider").value,
    model: $("model").value
  };

  chats.unshift(chat);
  currentChatId = chat.id;
  saveChats();
  renderChat();
  renderHistory();
  $("prompt").focus();
}

function renderHistory() {
  $("history").innerHTML = "";

  chats.forEach(chat => {
    const item = document.createElement("div");
    item.className = "history-item" +
      (chat.id === currentChatId ? " active" : "");

    const title = document.createElement("span");
    title.className = "history-title";
    title.textContent = chat.title;

    title.onclick = () => {
      currentChatId = chat.id;
      $("provider").value = chat.provider || "Gemini";
      updateModels(chat.model);
      renderChat();
      renderHistory();
    };

    const actions = document.createElement("div");
    actions.className = "history-actions";

    const menu = document.createElement("button");
    menu.textContent = "⋯";

    menu.onclick = event => {
      event.stopPropagation();
      const choice = prompt("Type rename or delete:");

      if (choice === "rename") {
        const name = prompt("New chat name:", chat.title);
        if (name && name.trim()) {
          chat.title = name.trim();
          saveChats();
          renderHistory();
          if (chat.id === currentChatId) {
            $("chatTitle").textContent = chat.title;
          }
        }
      }

      if (choice === "delete") {
        if (confirm("Delete this chat?")) {
          chats = chats.filter(c => c.id !== chat.id);
          if (currentChatId === chat.id) {
            currentChatId = null;
            if (chats.length) {
              currentChatId = chats[0].id;
            } else {
              saveChats();
              newChat();
              return;
            }
            renderChat();
          }
          saveChats();
          renderHistory();
        }
      }
    };

    actions.appendChild(menu);
    item.append(title, actions);
    $("history").appendChild(item);
  });
}

function renderMarkdown(text) {
  const html = marked.parse(text || "");
  return DOMPurify.sanitize(html);
}

function renderChat() {
  const chat = currentChat();
  if (!chat) return;

  $("chatTitle").textContent = chat.title;
  $("messages").innerHTML = "";

  if (!chat.messages.length) {
    $("messages").innerHTML = `
      <div class="welcome">
        <h1>What can I help with?</h1>
        <p>Ask anything. Let's get started.</p>
      </div>`;
    return;
  }

  chat.messages.forEach(message => addMessage(message.role, message.content));
}

function addMessage(role, content) {
  const message = document.createElement("div");
  message.className = "message " + role;

  const avatar = document.createElement("div");
  avatar.className = "avatar";
  avatar.textContent = role === "user" ? "YOU" : "AI";

  const body = document.createElement("div");
  body.className = "content";
  body.innerHTML = renderMarkdown(content);

  body.querySelectorAll("pre").forEach(pre => {
    const code = pre.querySelector("code");
    const toolbar = document.createElement("div");
    toolbar.className = "code-toolbar";

    const copy = document.createElement("button");
    copy.textContent = "Copy code";
    copy.onclick = () => {
      navigator.clipboard.writeText(code?.innerText || pre.innerText);
      copy.textContent = "Copied!";
      setTimeout(() => copy.textContent = "Copy code", 1200);
    };

    toolbar.appendChild(copy);

    const preview = document.createElement("button");
    preview.textContent = "Preview";
    preview.onclick = () => previewCode(code?.innerText || pre.innerText);
    toolbar.appendChild(preview);

    pre.before(toolbar);
  });

  body.querySelectorAll("pre code").forEach(block => {
    hljs.highlightElement(block);
  });

  message.append(avatar, body);
  $("messages").appendChild(message);
  $("messages").scrollTop = $("messages").scrollHeight;
}

function previewCode(code) {
  const modal = $("writerModal");
  $("writerText").value = code;
  modal.classList.add("open");
  alert("Preview is available in the editor. Only run code you understand.");
}

function formatText(before, after) {
  const input = $("prompt");
  const start = input.selectionStart;
  const end = input.selectionEnd;
  const selected = input.value.slice(start, end);

  input.value =
    input.value.slice(0, start) +
    before + selected + after +
    input.value.slice(end);

  input.focus();
  input.selectionStart = start + before.length;
  input.selectionEnd = start + before.length + selected.length;
}

function handleEnter(event) {
  if (event.key === "Enter" && !event.shiftKey) {
    event.preventDefault();
    sendMessage();
  }
}

async function loadModels() {
  $("modelStatus").textContent = "Loading models...";

  try {
    const response = await fetch("/api/models");
    const data = await response.json();

    if (!response.ok) throw new Error(data.error || "Model loading failed");

    groups = data.groups || {};
    updateModels();

    $("modelStatus").textContent = "Models loaded";
  } catch (error) {
    $("modelStatus").textContent = error.message;
    $("model").innerHTML = '<option value="">Could not load models</option>';
  }
}

function providerChanged() {
  updateModels();
  const chat = currentChat();

  if (chat) {
    chat.provider = $("provider").value;
    chat.model = $("model").value;
    saveChats();
  }
}

function updateModels(preferredModel = "") {
  const provider = $("provider").value;
  const models = groups[provider] || [];

  $("model").innerHTML = "";

  if (!models.length) {
    $("model").add(new Option("No available models", ""));
    return;
  }

  models.forEach(model => {
    const option = new Option(model.name, model.id);
    $("model").add(option);
  });

  if (preferredModel && models.some(m => m.id === preferredModel)) {
    $("model").value = preferredModel;
  }

  const chat = currentChat();
  if (chat) {
    chat.provider = provider;
    chat.model = $("model").value;
    saveChats();
  }
}

async function sendMessage() {
  if (busy) return;

  const text = $("prompt").value.trim();
  if (!text) return;

  const provider = $("provider").value;
  const model = $("model").value;

  if (!model) {
    alert("Please select an available model.");
    return;
  }

  const chat = currentChat();
  if (!chat) return;

  if (chat.messages.length === 0) {
    chat.title = text.slice(0, 35);
  }

  chat.provider = provider;
  chat.model = model;

  chat.messages.push({ role: "user", content: text });
  addMessage("user", text);
  $("prompt").value = "";
  renderHistory();
  saveChats();

  busy = true;
  $("sendButton").disabled = true;
  $("sendButton").textContent = "Thinking...";

  const loading = document.createElement("div");
  loading.className = "message";
  loading.innerHTML = '<div class="avatar">AI</div><div class="content">Thinking...</div>';
  $("messages").appendChild(loading);

  try {
    const apiProvider =
      provider === "Gemini" ? "Gemini" :
      provider === "ChatGPT" ? "Groq" :
      provider === "Groq" ? "Groq" :
      provider === "Gemini" ? "Gemini" :
      "OpenRouter";

    const response = await fetch("/api/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        provider: apiProvider,
        model,
        messages: chat.messages
      })
    });

    const data = await response.json();

    if (!response.ok) {
      throw new Error(data.error || "The request failed.");
    }

    loading.remove();

    chat.messages.push({
      role: "assistant",
      content: data.reply
    });

    addMessage("assistant", data.reply);
    saveChats();

  } catch (error) {
    loading.remove();
    addMessage("assistant", "**Error:** " + error.message);
  } finally {
    busy = false;
    $("sendButton").disabled = false;
    $("sendButton").textContent = "Send ↑";
  }
}

function handleFiles(event) {
  selectedFiles = Array.from(event.target.files || []);

  if (selectedFiles.length) {
    $("fileLabel").textContent =
      selectedFiles.map(file => file.name).join(", ");
    alert("File selection is ready, but file contents are not yet sent to the AI. Upload processing needs its own backend route.");
  }
}

function openWriter() {
  $("writerModal").classList.add("open");
}

function closeWriter() {
  $("writerModal").classList.remove("open");
}

function insertWriting() {
  $("prompt").value +=
    ($("prompt").value ? "\n\n" : "") + $("writerText").value;
  closeWriter();
}

$("model").addEventListener("change", () => {
  const chat = currentChat();
  if (chat) {
    chat.model = $("model").value;
    saveChats();
  }
});

loadChats();
loadModels();
</script>

</body>
</html>
